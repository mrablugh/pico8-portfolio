<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aaron Jackson's Game Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    :root {
      --color-primary: #6e1720;
      --color-primary-2: #9e2b34;
      --color-primary-3: #f3c6c6;
      --color-cream: #f5f2eb;
      --color-text: #2b1a1a;
    }

    body {
      margin: 0;
      color: var(--color-text);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.25), transparent 30%),
        linear-gradient(180deg, var(--color-primary) 0%, var(--color-cream) 28%, var(--color-cream) 72%, var(--color-primary) 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(110, 23, 32, 0.96);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .nav-bar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--color-cream);
      font-size: 0.95rem;
    }

    .nav-links a:hover,
    .game-card a:hover {
      text-decoration: underline;
    }

    .hero {
      padding: 72px 0 56px;
      text-align: center;
      background:
        linear-gradient(rgba(70, 18, 20, 0.5), rgba(70, 18, 20, 0.7)),
        radial-gradient(circle at 20% 20%, rgba(255, 150, 150, 0.36), transparent 28%),
        radial-gradient(circle at 80% 30%, rgba(255, 200, 190, 0.26), transparent 24%),
        linear-gradient(135deg, var(--color-primary), var(--color-primary-2) 55%, var(--color-primary));
    }

    .hero-content {
      display: flex;
      justify-content: center;
    }

    .profile-card {
      width: min(680px, 100%);
      padding: 56px 28px;
      color: #f5f7fb;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      background: rgba(16, 24, 40, 0.32);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(6px);
    }

    .profile-photo {
      width: 128px;
      height: 128px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--color-primary);
      font-size: 2rem;
      font-weight: bold;
      border: 5px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-cream), var(--color-primary-3));
    }

    .eyebrow,
    .section-label {
      margin: 0 0 10px;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;
      color: #f5f7fb;
      font-size: clamp(2.2rem, 5vw, 4rem);
    }

    .hero h1 span {
      color: var(--color-primary-3);
    }

    .hero-text {
      max-width: 56ch;
      margin: 18px auto 0;
      color: var(--color-cream);
      line-height: 1.7;
    }

    .section {
      padding: 72px 0;
    }

    .section-light {
      background: var(--color-cream);
    }

    .section-dark {
      color: #f5f7fb;
      background: var(--color-primary);
    }

    .section h2 {
      margin: 0 0 18px;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
    }

    .section-heading {
      margin-bottom: 32px;
    }

    .section-heading p {
      margin: 0;
      color: #765b5b;
    }

    .section p {
      line-height: 1.7;
    }

    .section-label-light {
      color: #ffdfe0;
    }

    .project-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
    }

    .game-card {
      overflow: hidden;
      border: 1px solid rgba(158, 43, 52, 0.08);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 14px 30px rgba(110, 23, 32, 0.06);
    }

    .card-content {
      padding: 24px;
    }

    .card-content h3 {
      margin: 0 0 12px;
      color: var(--color-primary);
    }

    .card-content p {
      margin-bottom: 22px;
    }

    .game-card a {
      color: var(--color-primary-2);
      font-weight: bold;
    }

    .screenshot {
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      background:
        linear-gradient(135deg, rgba(110, 23, 32, 0.82), rgba(158, 43, 52, 0.52)),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0 2px, transparent 2px 12px);
    }

    .game-embed {
      width: 100%;
      max-width: 621px;
    }

    .game-embed iframe {
      width: 100%;
      aspect-ratio: 621 / 513;
      border: 0;
      display: block;
    }

    footer {
      padding: 30px 0;
      text-align: center;
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      .hero {
        padding: 56px 0 40px;
      }

      .section {
        padding: 56px 0;
      }
    }

    @media (max-width: 480px) {
      .hero {
        padding: 42px 0 32px;
      }

      .section {
        padding: 40px 0;
      }

      .game-card {
        flex-basis: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="hero">
    <div class="container">
      <h1>Aaron <span>Jackson</span></h1>
      <p class="hero-text">
        Games I built in PICO-8 for GAME-401. Each one runs in the browser.<br>
        <br>
        Controls: arrow keys to move, Z and X for the two buttons.
      </p>
    </div>
  </header>

  <main class="section section-light">
    <div class="container">
      <div class="section-heading">
        <h2>Selected Games</h2>
        <p>Explore a selection of my recent projects.</p>
      </div>

      <section class="project-list" aria-label="Game portfolio">
        <article class="game-card">
          <div class="screenshot"><img src="thumb.png" alt="Screenshot of my PICO-8 game"></div>
          <div class="card-content">
            <h3>Fox in a Box</h3>
            <p>
              Virtual Pet game featuring a fox.
            </p>
            <div class="game-embed">
              <iframe src="https://www.lexaloffle.com/bbs/widget.php?pid=fox_box" allowfullscreen width="621" height="513" style="border:none; overflow:hidden"></iframe>
            </div>
          </div>
        </article>

        <!--
        <article class="game-card">
          <div class="screenshot">GAME SCREENSHOT</div>
          <div class="card-content">
            <h3>Moonlit Vale</h3>
            <p>
              A quiet exploration game about discovering forgotten secrets
              in a mysterious forest beneath a silver moon.
            </p>
            <div class="game-embed">
              Replace this area with an embedded game iframe.
            </div>
          </div>
        </article>

        <article class="game-card">
          <div class="screenshot">GAME SCREENSHOT</div>
          <div class="card-content">
            <h3>Signal Lost</h3>
            <p>
              A minimalist puzzle adventure where every transmission reveals
              another piece of a vanished expedition.
            </p>
            <div class="game-embed">
              Replace this area with an embedded game iframe.
            </div>
          </div>
        </article>
        -->
      </section>
    </div>
  </main>

  <footer class="section-dark">
    <div class="container">
      &copy; 2026 Aaron Jackson. All rights reserved.
    </div>
  </footer>
</body>
</html>
